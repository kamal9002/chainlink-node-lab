name: chainlink-node

volumes:
  grafana_data:
  loki_data:
  chainlink_data:
  postgres_data:

services:
  postgres:
    image: postgres:14
    container_name: chainlink_v2-postgres
    environment:
      POSTGRES_USER: chainlink
      POSTGRES_PASSWORD: <PASSWORD>
      POSTGRES_DB: chainlink
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainlink -h localhost"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 5
    networks:
      - monitor_network

  chainlink-v2:
    image: smartcontract/chainlink:2.26.0
    container_name: chainlink_v2-node
    user: root
    depends_on:
      postgres:
        condition: service_started
    ports:
      - "6688:6688"
    volumes:
      - chainlink_data:/chainlink
      - ./secrets.toml:/chainlink/secrets.toml:ro
      - ./config.toml:/chainlink/config.toml:ro
      - ./.api:/chainlink/.api:ro
      - chainlink_data:/var/log/chainlink
    command: >
      node -config /chainlink/config.toml -secrets /chainlink/secrets.toml start -a /chainlink/.api
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6688/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - monitor_network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    depends_on:
      chainlink-v2:
        condition: service_started
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - monitor_network

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node-exporter
    restart: always
    ports:
      - "9100:9100"
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - monitor_network

  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./loki/config.yml:/etc/loki/config.yml:ro
    command: -config.file=/etc/loki/config.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - monitor_network

  promtail:
    image: grafana/promtail:2.9.4
    container_name: promtail
    restart: unless-stopped
    volumes:
      - chainlink_data:/var/log/chainlink:ro  
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - monitor_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - monitor_network

networks:
  monitor_network:
    driver: bridge